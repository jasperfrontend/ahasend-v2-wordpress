# On every v* tag: check the version, lint, build the plugin zip and update.json, publish them as a release.
# Sites check releases/latest/download/update.json and install the zip it points to.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLUGIN: xolution-maildelivery
    steps:
      # Pinned to commit SHAs: this job publishes what every site auto-installs, so a moved tag must not change it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: none

      - name: Tag matches the plugin version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAIN="$PLUGIN/$PLUGIN.php"
          HEADER=$(sed -n 's/^ \* Version: *//p' "$MAIN" | tr -d '\r ')
          CONST=$(sed -n "s/^const VERSION *= *'\([^']*\)';.*/\1/p" "$MAIN" | tr -d '\r')
          echo "tag=$VERSION header=$HEADER const=$CONST"
          if [ "$VERSION" != "$HEADER" ] || [ "$VERSION" != "$CONST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the plugin header ($HEADER) and VERSION constant ($CONST)."
            exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version $VERSION is not x.y.z."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Lint
        run: find "$PLUGIN" -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Translation template up to date
        run: php bin/make-pot.php --check

      - name: Compiled translations up to date
        run: php bin/compile-translations.php --check

      - name: Build zip and update.json
        run: |
          MAIN="$PLUGIN/$PLUGIN.php"
          REQUIRES=$(sed -n 's/^ \* Requires at least: *//p' "$MAIN" | tr -d '\r ')
          REQUIRES_PHP=$(sed -n 's/^ \* Requires PHP: *//p' "$MAIN" | tr -d '\r ')
          zip -rq "$PLUGIN.zip" "$PLUGIN"
          jq -n \
            --arg version "$VERSION" \
            --arg package "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$PLUGIN.zip" \
            --arg url "https://github.com/$GITHUB_REPOSITORY" \
            --arg requires "$REQUIRES" \
            --arg requires_php "$REQUIRES_PHP" \
            '{version: $version, package: $package, url: $url, requires: $requires, requires_php: $requires_php}' \
            > update.json
          cat update.json
          unzip -l "$PLUGIN.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PLUGIN.zip" update.json \
            --title "Xolution MailDelivery $VERSION" \
            --generate-notes \
            --latest
